<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'" />
    <title>连上 Pupu</title>
    <link rel="stylesheet" href="page.css" />
  </head>
  <body class="pair">
    <div class="art" aria-hidden="true"></div>
    <div class="side">
      <form class="stack" id="form">
        <h1 id="title">Pupu</h1>
        <p id="lead"></p>
        <button id="google" class="light" type="button" hidden></button>
        <div class="or" id="or" hidden>或</div>
        <input id="code" type="text" placeholder="配对码" aria-label="配对码" autocomplete="one-time-code" spellcheck="false" />
        <label class="check" id="adopt-row" hidden>
          <input id="adopt" type="checkbox" checked />
          <span id="adopt-label"></span>
        </label>
        <button id="submit" type="submit">继续</button>
        <p class="error" id="error" role="alert" hidden></p>
      </form>
      <p class="hint" id="hint"></p>
    </div>
    <script src="pair.js"></script>
  </body>
</html>
